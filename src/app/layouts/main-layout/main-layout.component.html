<a class="skip-link" href="#main">ข้ามไปเนื้อหา</a>
<header class="header">
  <span class="brand">SIRI.AUTOPOST</span>
  <div class="actions">
    <button type="button" class="btn btn-ghost" (click)="theme.toggle()">สลับธีม</button>
    @if (authEnabled) {
      <button type="button" class="btn btn-ghost" (click)="auth.logout()">ออกจากระบบ</button>
    }
  </div>
</header>
<div class="shell">
  <nav class="sidebar" aria-label="เมนูหลัก">
    @for (item of nav; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
    }
  </nav>
  <main id="main" class="content">
    <router-outlet />
  </main>
</div>
