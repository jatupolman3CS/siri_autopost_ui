<div class="page">
  <div class="page-head">
    <div>
      <h1>{{ t().lib.title }}</h1>
      <p>{{ t().lib.sub }}</p>
      <app-perm-note level="edit" />
    </div>
    <div class="actions">
      <button
        type="button"
        class="su-btn su-btn-sm su-btn-secondary"
        [disabled]="!perm.canEdit()"
        [attr.title]="perm.editHint() || null"
        (click)="openSnippet()"
      >
        <i class="ph ph-text-t"></i>{{ t().lib.newSnippet }}
      </button>
      <button
        type="button"
        class="su-btn su-btn-sm su-btn-primary"
        [disabled]="uploading() || !perm.canEdit()"
        [attr.title]="perm.editHint() || null"
        (click)="picker.click()"
      >
        <i class="ph ph-upload-simple"></i>{{ t().lib.upload }}
      </button>
      <input
        #picker
        type="file"
        accept="image/*,video/*"
        multiple
        hidden
        (change)="upload(picker)"
      />
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button
      type="button"
      role="tab"
      [class.on]="tab() === 'media'"
      [attr.aria-selected]="tab() === 'media'"
      (click)="tab.set('media')"
    >
      {{ t().lib.tabMedia }}
      @if (library.loaded()) {
        ({{ library.media().length }})
      }
    </button>
    <button
      type="button"
      role="tab"
      [class.on]="tab() === 'text'"
      [attr.aria-selected]="tab() === 'text'"
      (click)="tab.set('text')"
    >
      {{ t().lib.tabText }}
      @if (library.loaded()) {
        ({{ library.snippets().length }})
      }
    </button>
  </div>

  @if (tab() === 'media') {
    <div class="grid g180">
      @for (m of mediaRows(); track m.id) {
        <div class="panel panel-hover card">
          <div class="thumb">
            @if (m.src) {
              <img [src]="m.src" alt="" />
            } @else {
              <i class="ph" [class]="m.icon"></i>
            }
          </div>
          <div class="fw5 fs14 ellipsis">{{ m.label }}</div>
          <div class="small muted">{{ m.meta }}</div>
          <div class="small muted">{{ m.used }}</div>
          <button
            type="button"
            class="su-btn su-btn-sm su-btn-ghost su-btn-full"
            (click)="useMedia(m.id)"
          >
            {{ t().lib.use }}
          </button>
        </div>
      }
    </div>
  } @else {
    <div class="grid g280">
      @for (s of snippetRows(); track s.id) {
        <div class="panel panel-hover card snip">
          <div class="fs14 fw6">{{ s.title }}</div>
          <p class="fs14 muted grow-p">{{ s.text }}</p>
          <div class="foot">
            <button
              type="button"
              class="su-btn su-btn-sm su-btn-ghost"
              (click)="useSnippet(s.text)"
            >
              {{ t().lib.use }}
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>

<app-modal [open]="modal()" [title]="t().lib.newSnippet" (closed)="modal.set(false)">
  <div class="form">
    <app-input-field
      [label]="t().lib.snippetTitle"
      [(value)]="formTitle"
      [maxlength]="limits.snippetTitle"
    />
    <app-input-field
      [label]="t().lib.snippetText"
      [(value)]="formText"
      [error]="formErr()"
      [maxlength]="limits.snippetText"
    />
  </div>
  <div modal-footer>
    <button type="button" class="su-btn su-btn-sm su-btn-secondary" (click)="modal.set(false)">
      {{ t().common.cancel }}
    </button>
    <button
      type="button"
      class="su-btn su-btn-sm su-btn-primary"
      [disabled]="!perm.canEdit()"
      (click)="saveSnippet()"
    >
      {{ t().common.save }}
    </button>
  </div>
</app-modal>
