<section class="panel stack">
  <h2 class="h2">{{ x().backupTitle }}</h2>

  <div class="box stack">
    <h3 class="h3">{{ x().exportTitle }}</h3>
    <span class="su-select-wrap">
      <select
        class="su-select ext-in"
        [attr.aria-label]="x().exportScope"
        (change)="scope.set($any($event.target).value)"
      >
        <option value="all" [selected]="scope() === 'all'">{{ x().exportAll }}</option>
        <option value="current" [selected]="scope() === 'current'">
          {{ x().exportCurrent }}
        </option>
      </select>
      <i class="ph ph-caret-down su-select-caret"></i>
    </span>
    <label class="ext-check">
      <input
        type="checkbox"
        [checked]="images()"
        (change)="images.set($any($event.target).checked)"
      />
      {{ x().exportImages }}
    </label>
    <label class="ext-check">
      <input
        type="checkbox"
        [checked]="token()"
        (change)="token.set($any($event.target).checked)"
      />
      {{ x().exportToken }}
    </label>
    <div>
      <button
        type="button"
        class="su-btn su-btn-sm su-btn-secondary"
        [disabled]="busy()"
        (click)="exportFile()"
      >
        <i class="ph ph-download-simple"></i>{{ x().exportBtn }}
      </button>
    </div>
  </div>

  <div class="box stack">
    <h3 class="h3">{{ x().configFileTitle }}</h3>
    <p class="ext-hint">{{ x().configFileHint }}</p>
    <label class="ext-check">
      <input
        type="checkbox"
        [checked]="cfgToken()"
        (change)="cfgToken.set($any($event.target).checked)"
      />
      {{ x().cfgToken }}
    </label>
    <label class="ext-check">
      <input
        type="checkbox"
        [checked]="cfgAutoStart()"
        (change)="cfgAutoStart.set($any($event.target).checked)"
      />
      {{ x().cfgAutoStart }}
    </label>
    <div>
      <button
        type="button"
        class="su-btn su-btn-sm su-btn-secondary"
        [disabled]="busy()"
        (click)="configFile()"
      >
        <i class="ph ph-file-arrow-down"></i>{{ x().configFileBtn }}
      </button>
    </div>
  </div>

  <fieldset class="box stack ext-fs" [disabled]="actions.readOnly() || busy()">
    <h3 class="h3">{{ x().importTitle }}</h3>
    <span class="su-select-wrap">
      <select
        class="su-select ext-in"
        [attr.aria-label]="x().importMode"
        (change)="mode.set($any($event.target).value)"
      >
        <option value="replace" [selected]="mode() === 'replace'">
          {{ x().importReplace }}
        </option>
        <option value="merge" [selected]="mode() === 'merge'">{{ x().importMerge }}</option>
      </select>
      <i class="ph ph-caret-down su-select-caret"></i>
    </span>
    <div class="actions">
      <label class="su-btn su-btn-sm su-btn-secondary ext-file">
        <i class="ph ph-upload-simple"></i>{{ x().importJson }}
        <input
          type="file"
          accept=".json,application/json"
          (change)="importJson($any($event.target))"
        />
      </label>
      <label class="su-btn su-btn-sm su-btn-secondary ext-file">
        <i class="ph ph-file-zip"></i>{{ x().importSiri }}
        <input
          type="file"
          accept=".zip,application/zip"
          (change)="importSiri($any($event.target))"
        />
      </label>
    </div>
    <p class="ext-hint">{{ x().importSiriHint }}</p>
    <p class="ext-hint">{{ x().importStopFirst }}</p>
  </fieldset>
</section>
