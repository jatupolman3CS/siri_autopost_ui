<section class="panel card" [class.off-item]="!collection().active">
  <div class="head">
    <span class="ico"><i class="ph" [class]="collection().icon"></i></span>
    <div class="grow info">
      <div class="fw6">{{ collection().name }}</div>
      <div class="small muted">{{ meta() }}</div>
      @if (!collection().active) {
        <div class="small off-note">{{ t().api.colOffHint }}</div>
      }
    </div>
    <div class="btns">
      <app-checkbox
        [label]="t().api.itemActive"
        [checked]="collection().active"
        [disabled]="!perm.canEdit()"
        (checkedChange)="setActive($event)"
      />
      <button
        type="button"
        class="ibtn"
        [disabled]="!perm.canEdit()"
        [attr.title]="perm.editHint() || t().api.itemRename"
        [attr.aria-label]="t().api.colRename"
        (click)="renameOpen.set(true)"
      >
        <i class="ph ph-pencil-simple"></i>
      </button>
      <button
        type="button"
        class="ibtn"
        [disabled]="!perm.canEdit()"
        [attr.title]="perm.editHint() || t().api.itemDelete"
        [attr.aria-label]="t().api.colDelete"
        (click)="deleteOpen.set(true)"
      >
        <i class="ph ph-trash"></i>
      </button>
      <button
        type="button"
        class="su-btn su-btn-sm su-btn-ghost"
        [disabled]="!perm.canEdit()"
        [attr.title]="perm.editHint() || null"
        (click)="add()"
      >
        <i class="ph ph-pencil-simple-line"></i>{{ t().col.addPost }}
      </button>
      <button
        type="button"
        class="su-btn su-btn-sm su-btn-ghost"
        data-testid="add-from-library"
        [disabled]="!perm.canEdit()"
        [attr.title]="perm.editHint() || null"
        (click)="libraryOpen.set(true)"
      >
        <i class="ph ph-tray-arrow-down"></i>{{ t().api.flow.colAddFromLib }}
      </button>
      <button type="button" class="su-btn su-btn-sm su-btn-secondary" (click)="schedule()">
        <i class="ph ph-calendar-check"></i>{{ t().col.schedule }}
      </button>
      <button
        type="button"
        class="su-btn su-btn-sm su-btn-ghost"
        [attr.aria-expanded]="cfgOpen()"
        (click)="cfgOpen.set(!cfgOpen())"
      >
        <i class="ph ph-gear"></i>{{ cfgOpen() ? t().col.hideSettings : t().col.settings }}
      </button>
      <button
        type="button"
        class="su-btn su-btn-sm su-btn-ghost"
        [attr.aria-expanded]="open()"
        (click)="toggle()"
      >
        {{ open() ? t().col.collapse : t().col.expand }}
      </button>
    </div>
  </div>
  @if (cfgOpen()) {
    <app-collection-settings [collection]="collection()" />
  }
  @if (open()) {
    <div class="posts">
      @for (p of posts(); track p.id) {
        <app-collection-post-row [collection]="collection()" [post]="p" />
      }
      <app-pager [pager]="pager" />
      @if (!collection().posts.length) {
        <p class="empty">{{ t().col.empty }}</p>
      }
    </div>
  }
</section>

@if (libraryOpen()) {
  <app-add-from-library-modal [collection]="collection()" (closed)="libraryOpen.set(false)" />
}

<app-rename-modal
  [open]="renameOpen()"
  [title]="t().api.colRename"
  [label]="t().col.colName"
  [value]="collection().name"
  [maxlength]="nameLimit"
  [save]="saveName"
  (closed)="renameOpen.set(false)"
/>

<app-confirm-modal
  [open]="deleteOpen()"
  [title]="t().api.colDelete"
  [body]="deleteBody()"
  [action]="remove"
  (closed)="deleteOpen.set(false)"
/>
