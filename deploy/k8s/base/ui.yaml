apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: siriautopost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
        app.kubernetes.io/part-of: siriautopost
    spec:
      containers:
        - name: ui
          image: siriautopost-web
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# Public entry point. The Cloudflare tunnel `siri-monitor` (locally managed, cloudflared on the host) routes
# siriautopost.siristudiophoto.com -> http://172.17.0.1:30907 (PRD) and siriautopost-dev.siristudiophoto.com -> :30908 (DEV, patched by overlays/dev), like the other apps on this host.
# nginx in this pod serves the dashboard and proxies /api to Service `api` (siri_autopost_backend).
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: siriautopost
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30907
