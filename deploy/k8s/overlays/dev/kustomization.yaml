apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DEV: https://siriautopost-dev.siristudiophoto.com  |  namespace siriautopost-dev
# Applied by Jenkinsfile.dev (Jenkins job SIRIAUTOPOST-WEB-DEV). Separate from PRD (namespace siriautopost, NodePort 30907).
# Exposed on NodePort 30908; the Cloudflare tunnel routes the dev host there.
namespace: siriautopost-dev

resources:
  - ../../base

images:
  # newTag is rewritten by the Jenkinsfile for every build; the value below is never deployed as-is.
  - name: siriautopost-web
    newName: localhost:5000/siriautopost-web
    newTag: set-by-jenkins

patches:
  - target:
      kind: Service
      name: ui
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30908
