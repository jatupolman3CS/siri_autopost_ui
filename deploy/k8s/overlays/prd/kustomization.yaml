apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PRD: https://siriautopost.siristudiophoto.com
# Applied by the Jenkinsfile at the repo root (Jenkins job SIRIAUTOPOST-WEB).
# The Ingress for this host lives in siri_autopost_backend (deploy/k8s/overlays/prd).
namespace: siriautopost

resources:
  - ../../base

images:
  # newTag is rewritten by the Jenkinsfile for every build; the value below is never deployed as-is.
  - name: siriautopost-web
    newName: localhost:5000/siriautopost-web
    newTag: set-by-jenkins
