apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PRD: https://siriautopost.siristudiophoto.com
# Applied by Jenkinsfile (Jenkins job SIRIAUTOPOST-WEB-PRD). Separate from DEV (namespace siriautopost-dev, NodePort 30908).
# Exposed on NodePort 30907; the Cloudflare tunnel routes the public host there (see deploy/k8s/base/ui.yaml).
namespace: siriautopost

resources:
  - ../../base

images:
  # newTag is rewritten by the Jenkinsfile for every build; the value below is never deployed as-is.
  - name: siriautopost-web
    newName: localhost:5000/siriautopost-web
    newTag: set-by-jenkins
