server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Media uploads go up to 100 MB (MediaFile.MaxBytes in the API).
    client_max_body_size 101m;

    # The event stream (Server-Sent Events) stays open up to 30 minutes with a ping every 15 s:
    # pass bytes through as they come and do not time it out between pings.
    location ~ ^/api/workspaces/[^/]+/events/stream$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Campaign media (the extension's settings page on the web and the browser itself) goes up as base64 JSON:
    # a 200 MB video is about 270 MB on the wire, and the API accepts up to 300 MB there (MaxImageBody).
    location ~ ^/api/(device/images/[^/]+|workspaces/[^/]+/extension-images/[^/]+)$ {
        client_max_body_size 300m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/device/sync may hold the call up to 25 s (long polling); 120 s leaves room.
        proxy_read_timeout 120s;
    }

    # Hashed bundles never change; index.html must always be fresh.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
